# Builds the site and publishes dist/ to GitHub Pages.
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Once a day, so the GitHub heatmap under the contents stays current.
  schedule:
    - cron: "17 6 * * *"

# The build (and npm ci's install scripts) only reads; the deploy job alone may publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fresh contribution counts for the heatmap. If GitHub is unreachable or
      # its page has changed, the build goes on with the snapshot in the repo.
      - run: python3 -I scripts/github-data.py
        continue-on-error: true
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
